name: Sync to Hugging Face Space

on:
  push:
    branches: [main] # จะทำงานเมื่อมีการ Push เข้ากิ่ง main
  workflow_dispatch: # ทำให้เรากดปุ่มรันเองจากหน้าเว็บได้ด้วย

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://25j4:$HF_TOKEN@huggingface.co/spaces/Naphatbo/prixxy-cafe main